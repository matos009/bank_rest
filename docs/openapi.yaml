components:
  schemas:
    SetRolesRequest:
      required:
        - roles
      type: object
      properties:
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
    UserResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
        fullName:
          type: string
        enabled:
          type: boolean
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CreateUserRequest:
      required:
        - email
        - password
      type: object
      properties:
        email:
          type: string
        password:
          maxLength: 255
          minLength: 6
          type: string
        fullName:
          maxLength: 255
          minLength: 0
          type: string
        roles:
          uniqueItems: true
          type: array
          items:
            type: string
    ChangePasswordRequest:
      required:
        - newPassword
        - oldPassword
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          maxLength: 255
          minLength: 6
          type: string
    TransferRequest:
      type: object
      properties:
        fromCardId:
          type: integer
          format: int64
        toCardId:
          type: integer
          format: int64
        amount:
          type: number
        description:
          type: string
    TransferResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        fromCardId:
          type: integer
          format: int64
        toCardId:
          type: integer
          format: int64
        amount:
          type: number
        status:
          type: string
          enum:
            - PENDING
            - SUCCESS
            - FAILED
        description:
          type: string
        createdAt:
          type: string
          format: date-time
    CreateCardRequest:
      type: object
      properties:
        pan:
          pattern: \d{12,19}
          type: string
        expMonth:
          maximum: 12
          minimum: 1
          type: integer
          format: int32
        expYear:
          maximum: 2100
          minimum: 2000
          type: integer
          format: int32
    CardResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        ownerId:
          type: integer
          format: int64
        maskedPan:
          type: string
        expMonth:
          type: integer
          format: int32
        expYear:
          type: integer
          format: int32
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - EXPIRED
        balance:
          type: number
        createdAt:
          type: string
          format: date-time
    LoginRequest:
      required:
        - password
      type: object
      properties:
        email:
          type: string
        password:
          type: string
    LoginResponse:
      type: object
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    UpdateUserRequest:
      type: object
      properties:
        fullName:
          maxLength: 255
          minLength: 0
          type: string
        enabled:
          type: boolean
    ChangeStatusRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - ACTIVE
            - BLOCKED
            - EXPIRED
    UpdateExpiryRequest:
      type: object
      properties:
        expMonth:
          type: integer
          format: int32
        expYear:
          type: integer
          format: int32
    PageUserResponse:
      type: object
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        first:
          type: boolean
        last:
          type: boolean
        size:
          type: integer
          format: int32
        content:
          type: array
          items:
            $ref: '#/components/schemas/UserResponse'
        number:
          type: integer
          format: int32
        sort:
          type: array
          items:
            $ref: '#/components/schemas/SortObject'
        pageable:
          $ref: '#/components/schemas/PageableObject'
